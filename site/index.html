<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTracker - Plume</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.0/400.css');
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.0/500.css');
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/syne@5.0.3/400.css');
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/syne@5.0.3/700.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #040404;
      --card: #0A0A0A;
      --b1: #181818;
      --b2: #262626;
      --t1: #E2DDD6;
      --t2: #606060;
      --t3: #2A2A2A;
      --mono: 'JetBrains Mono', 'Courier New', monospace;
      --display: 'Syne', system-ui, sans-serif;
      --mood-color: #2BD4CA;
      --mood-glow: rgba(43, 212, 202, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--t1);
      font-family: var(--display);
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-thumb {
      background: #1E1E1E;
      border-radius: 2px
    }

    input {
      font-family: inherit
    }

    input::placeholder {
      color: #303030
    }

    button {
      font-family: inherit;
      cursor: pointer
    }

    /* ── EMOTIONAL BORDER GLOW ─────────────────── */
    .app-border-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.8s ease;
      opacity: 0;
    }

    .app-border-glow.active {
      opacity: 1;
    }

    .app-border-glow::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      border-image: var(--border-gradient) 1;
      animation: borderPulse 2s ease-in-out infinite;
    }

    /* Corner glow blobs */
    .app-border-glow .glow-corner {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: cornerPulse 3s ease-in-out infinite;
    }

    .app-border-glow .glow-corner.tl {
      top: -60px;
      left: -60px;
    }

    .app-border-glow .glow-corner.tr {
      top: -60px;
      right: -60px;
      animation-delay: 0.5s;
    }

    .app-border-glow .glow-corner.bl {
      bottom: -60px;
      left: -60px;
      animation-delay: 1s;
    }

    .app-border-glow .glow-corner.br {
      bottom: -60px;
      right: -60px;
      animation-delay: 1.5s;
    }

    /* Edge glows */
    .app-border-glow .glow-edge {
      position: absolute;
      filter: blur(40px);
      opacity: 0.25;
      animation: edgePulse 4s ease-in-out infinite;
    }

    .app-border-glow .glow-edge.top {
      top: -10px;
      left: 10%;
      right: 10%;
      height: 6px;
    }

    .app-border-glow .glow-edge.bottom {
      bottom: -10px;
      left: 10%;
      right: 10%;
      height: 6px;
    }

    .app-border-glow .glow-edge.left {
      left: -10px;
      top: 10%;
      bottom: 10%;
      width: 6px;
    }

    .app-border-glow .glow-edge.right {
      right: -10px;
      top: 10%;
      bottom: 10%;
      width: 6px;
    }

    @keyframes borderPulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes cornerPulse {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.6;
        transform: scale(1.15);
      }
    }

    @keyframes edgePulse {

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* Overspend state - Danger */
    .mood-danger {
      --border-gradient: linear-gradient(135deg, #FF1744, #FF5252, #FF8A80, #FF5252, #FF1744);
      --mood-color: #FF5252;
      --mood-glow: rgba(255, 23, 68, 0.15);
    }

    .mood-danger .glow-corner,
    .mood-danger .glow-edge {
      background: #FF1744;
    }

    /* Warning state - approaching limit */
    .mood-warning {
      --border-gradient: linear-gradient(135deg, #FF9100, #FFB74D, #FFCC80, #FFB74D, #FF9100);
      --mood-color: #FFB23F;
      --mood-glow: rgba(255, 145, 0, 0.12);
    }

    .mood-warning .glow-corner,
    .mood-warning .glow-edge {
      background: #FF9100;
    }

    /* Safe state - under budget */
    .mood-safe {
      --border-gradient: linear-gradient(135deg, #00E676, #69F0AE, #B9F6CA, #69F0AE, #00E676);
      --mood-color: #3DD998;
      --mood-glow: rgba(0, 230, 118, 0.12);
    }

    .mood-safe .glow-corner,
    .mood-safe .glow-edge {
      background: #00E676;
    }

    /* Excellent state - well under budget */
    .mood-excellent {
      --border-gradient: linear-gradient(135deg, #00E5FF, #18FFFF, #84FFFF, #18FFFF, #00E5FF);
      --mood-color: #2BD4CA;
      --mood-glow: rgba(0, 229, 255, 0.12);
    }

    .mood-excellent .glow-corner,
    .mood-excellent .glow-edge {
      background: #00E5FF;
    }

    /* ── EMOTIONAL STATUS BANNER ──────────────── */
    .emotional-banner {
      position: relative;
      overflow: hidden;
      padding: 16px 30px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.6s ease;
      border-bottom: 1px solid transparent;
    }

    .emotional-banner .banner-bg {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      transition: opacity 0.4s;
    }

    .emotional-banner .banner-icon {
      font-size: 22px;
      flex-shrink: 0;
      animation: iconBounce 2s ease-in-out infinite;
    }

    .emotional-banner .banner-msg {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .emotional-banner .banner-pct {
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    @keyframes iconBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px);
      }
    }

    /* Danger banner */
    .emotional-banner.danger {
      color: #FF5252;
      border-bottom-color: #FF525233;
    }

    .emotional-banner.danger .banner-bg {
      background: linear-gradient(90deg, #FF1744, #FF5252);
    }

    .emotional-banner.danger .banner-icon {
      animation: shake 0.5s linear infinite;
    }

    /* Warning banner */
    .emotional-banner.warning {
      color: #FFB23F;
      border-bottom-color: #FFB23F33;
    }

    .emotional-banner.warning .banner-bg {
      background: linear-gradient(90deg, #FF9100, #FFB23F);
    }

    /* Safe banner */
    .emotional-banner.safe {
      color: #3DD998;
      border-bottom-color: #3DD99833;
    }

    .emotional-banner.safe .banner-bg {
      background: linear-gradient(90deg, #00E676, #3DD998);
    }

    /* Excellent banner */
    .emotional-banner.excellent {
      color: #00E5FF;
      border-bottom-color: #00E5FF33;
    }

    .emotional-banner.excellent .banner-bg {
      background: linear-gradient(90deg, #00E5FF, #18FFFF);
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-3px) rotate(-2deg);
      }

      75% {
        transform: translateX(3px) rotate(2deg);
      }
    }

    /* ── LAYOUT ────────────────────────────────── */
    .shell {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 30px
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      min-height: 100vh;
      padding-top: 20px;
    }

    .left {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 40px;
      border-right: 0.5px solid var(--b1)
    }

    .right {
      display: flex;
      flex-direction: column;
      padding-top: 10px;
    }

    .section {
      padding: 30px 40px;
      border-bottom: 0.5px solid var(--b1)
    }

    .section-last {
      padding: 25px 40px;
      border-bottom: 0.5px solid var(--b1);
      flex: 1;
      overflow-y: auto
    }

    .footer {
      padding: 25px 40px;
    }

    /* ── HEADER OVERRIDES ──────────────────────── */
    .top-left-logo {
      align-self: flex-start;
      margin-left: 40px;
      margin-bottom: 40px;
      text-align: left;
    }

    .top-right-user {
      display: flex;
      justify-content: flex-end;
      padding: 0 40px 20px;
      border-bottom: 0.5px solid var(--b1);
    }

    /* ── TYPE ──────────────────────────────────── */
    .label {
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--t2);
      text-transform: uppercase;
      font-weight: 500;
    }

    .mono {
      font-family: var(--mono)
    }

    .big-num {
      font-family: var(--mono);
      font-size: 42px;
      letter-spacing: -0.05em;
      font-weight: 500;
    }

    /* ── PILLS ─────────────────────────────────── */
    .period-btn {
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 0 6px;
      transition: color 0.2s;
      border-bottom: 1.5px solid transparent;
      color: var(--t2)
    }

    .period-btn.active {
      color: var(--t1);
      border-bottom-color: var(--t1)
    }

    /* ── LEGEND ITEM ───────────────────────────── */
    .leg {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 0.5px solid transparent;
      transition: all 0.2s
    }

    .leg:hover,
    .leg.active {
      background: color-mix(in srgb, var(--accent, #fff) 8%, transparent)
    }

    .leg:hover,
    .leg.active {
      border-color: color-mix(in srgb, var(--accent, #fff) 35%, transparent)
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: box-shadow 0.2s
    }

    .leg.active .leg-dot {
      box-shadow: 0 0 10px var(--accent, #fff)
    }

    .leg-name {
      font-size: 14px;
      color: var(--t2);
      transition: color 0.2s;
      font-weight: 500
    }

    .leg.active .leg-name {
      color: var(--t1)
    }

    .leg-sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--t3);
      transition: color 0.2s;
      margin-top: 2px
    }

    .leg.active .leg-sub {
      color: var(--accent, #fff)
    }

    /* ── GOAL ROW ──────────────────────────────── */
    .goal-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--b1)
    }

    .goal-row:last-child {
      border-bottom: none
    }

    .goal-info {
      flex: 1;
      min-width: 0
    }

    .goal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px
    }

    /* ── TXN ROW ───────────────────────────────── */
    .txn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--b1);
      cursor: pointer;
      transition: all 0.2s
    }

    .txn:last-child {
      border-bottom: none
    }

    .txn:hover {
      transform: translateX(4px);
      opacity: 0.8
    }

    .txn-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* ── BUDGET BAR ────────────────────────────── */
    .bbar {
      height: 4px;
      background: #0D0D0D;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px
    }

    .bfill {
      height: 100%;
      border-radius: 2px;
      transition: width 1.3s cubic-bezier(.4, 0, .2, 1)
    }

    /* ── INPUT ─────────────────────────────────── */
    .qinput {
      flex: 1;
      background: #080808;
      border: 1px solid var(--b1);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--t1);
      outline: none;
      transition: border-color 0.2s
    }

    .qinput:focus {
      border-color: var(--b2)
    }

    .qinput[type="file"] {
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .qbtn {
      background: transparent;
      border: 1px solid var(--b1);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--t2);
      transition: all 0.2s;
      font-weight: 700;
    }

    .qbtn:hover {
      background: #111;
      color: var(--t1)
    }

    /* ── BUTTON OVERRIDE ──────────────────────── */
    .btn-primary:hover {
      opacity: 0.8 !important;
    }

    /* ── ISO GRID BG ───────────────────────────── */
    .iso-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.012) 0, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 64px),
        repeating-linear-gradient(-60deg, rgba(255, 255, 255, 0.012) 0, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 64px);
      background-size: 64px 110px
    }

    /* ── CENTER TEXT - FIXED OVERLAP ──────────── */
    .ctext {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── RESPONSIVE ────────────────────────────── */
    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .left {
        border-right: none;
        border-bottom: 0.5px solid var(--b1)
      }

      .big-num {
        font-size: 32px
      }

      .section,
      .section-last,
      .footer {
        padding: 25px 25px;
      }
    }

    /* ── SCAN LINE ─────────────────────────────── */
    @keyframes scan {
      0% {
        transform: translateY(-100%)
      }

      100% {
        transform: translateY(100vh)
      }
    }

    .scanline {
      position: fixed;
      left: 0;
      right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.025), transparent);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 0
    }

    /* ── RING GLOW PULSE ───────────────────────── */
    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.25
      }
    }

    .pulse-dot {
      animation: pulse 3s ease-in-out infinite
    }

    /* ── MOOD INDICATOR BADGE ──────────────────── */
    .mood-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: all 0.4s ease;
    }

    .mood-badge.danger {
      background: #FF525215;
      color: #FF5252;
      border: 1px solid #FF525233;
    }

    .mood-badge.warning {
      background: #FFB23F15;
      color: #FFB23F;
      border: 1px solid #FFB23F33;
    }

    .mood-badge.safe {
      background: #3DD99815;
      color: #3DD998;
      border: 1px solid #3DD99833;
    }

    .mood-badge.excellent {
      background: #00E5FF15;
      color: #00E5FF;
      border: 1px solid #00E5FF33;
    }

    /* ── VIGNETTE OVERLAY ─────────────────────── */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      transition: all 1s ease;
    }
  </style>
</head>

<body>
  <div class="iso-bg"></div>
  <div class="scanline"></div>

  <!-- Emotional Border Glow -->
  <div id="borderGlow" class="app-border-glow">
    <div class="glow-corner tl"></div>
    <div class="glow-corner tr"></div>
    <div class="glow-corner bl"></div>
    <div class="glow-corner br"></div>
    <div class="glow-edge top"></div>
    <div class="glow-edge bottom"></div>
    <div class="glow-edge left"></div>
    <div class="glow-edge right"></div>
  </div>

  <!-- Vignette for mood -->
  <div id="vignetteOverlay" class="vignette-overlay"></div>

  <div id="app" style="min-height:100vh"></div>

  <script type="module">
    import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { createElement as h } from 'https://esm.sh/react@18';

    /* ── TOKENS ─────────────────────────────────── */
    const S = {
      bg: '#040404', card: '#0A0A0A', b1: '#181818', b2: '#262626',
      t1: '#E2DDD6', t2: '#606060', t3: '#2A2A2A',
      mono: "'JetBrains Mono','Courier New',monospace",
      display: "'Syne',system-ui,sans-serif",
    };

    const DEFAULT_COLORS = ['#FF5C5C', '#2BD4CA', '#A45EFF', '#FFB23F', '#3DD998', '#FF7F50', '#8A2BE2'];

    /* ── HELPERS ─────────────────────────────────*/
    const τ = r => 2 * Math.PI * r;
    const MathPow = Math.pow;
    const easeOutCubic = t => 1 - MathPow(1 - t, 3);
    const fmt = n => '₹' + Math.floor(n).toLocaleString('en-IN');

    /* ── EMOTIONAL FEEDBACK SYSTEM ───────────────*/
    function getMoodState(totalPct) {
      if (totalPct >= 1.0) return 'danger';
      if (totalPct >= 0.8) return 'warning';
      if (totalPct <= 0.5) return 'excellent';
      return 'safe';
    }

    function getMoodMessages(totalPct, totalSpent, targetLimit) {
      const overBy = totalSpent - targetLimit;
      const underBy = targetLimit - totalSpent;

      if (totalPct >= 1.5) {
        return {
          icon: '🔥',
          msg: `CRITICAL: ₹${Math.floor(overBy).toLocaleString('en-IN')} over budget! This is a financial emergency.`,
          sub: 'You need to stop all non-essential spending immediately.',
          emoji: '😰'
        };
      }
      if (totalPct >= 1.0) {
        return {
          icon: '🚨',
          msg: `Over budget by ₹${Math.floor(overBy).toLocaleString('en-IN')}! You've crossed the limit.`,
          sub: 'Every additional rupee is money you don\'t have. Cut back now.',
          emoji: '😓'
        };
      }
      if (totalPct >= 0.9) {
        return {
          icon: '⚠️',
          msg: `Danger zone! Only ₹${Math.floor(underBy).toLocaleString('en-IN')} left before you overshoot.`,
          sub: 'You\'re bleeding money. Consider freezing discretionary spending.',
          emoji: '😬'
        };
      }
      if (totalPct >= 0.8) {
        return {
          icon: '🔶',
          msg: `Caution: ${Math.round(totalPct * 100)}% of your budget used. ₹${Math.floor(underBy).toLocaleString('en-IN')} remaining.`,
          sub: 'Slow down. You\'re approaching your limit faster than expected.',
          emoji: '😟'
        };
      }
      if (totalPct <= 0.3) {
        return {
          icon: '🏆',
          msg: `Outstanding! You've saved ₹${Math.floor(underBy).toLocaleString('en-IN')} — only ${Math.round(totalPct * 100)}% used!`,
          sub: 'Financial discipline on point. Keep this momentum going!',
          emoji: '🤩'
        };
      }
      if (totalPct <= 0.5) {
        return {
          icon: '✨',
          msg: `Excellent control! ₹${Math.floor(underBy).toLocaleString('en-IN')} still in your pocket.`,
          sub: 'You\'re building great habits. Your future self thanks you.',
          emoji: '😎'
        };
      }
      return {
        icon: '✅',
        msg: `On track! ₹${Math.floor(underBy).toLocaleString('en-IN')} remaining in your budget.`,
        sub: 'Good balance between spending and saving.',
        emoji: '🙂'
      };
    }

    function getMoodColor(mood) {
      switch (mood) {
        case 'danger': return '#FF5252';
        case 'warning': return '#FFB23F';
        case 'safe': return '#3DD998';
        case 'excellent': return '#2BD4CA';
        default: return '#E2DDD6';
      }
    }

    function updateBorderGlow(mood) {
      const el = document.getElementById('borderGlow');
      const vignette = document.getElementById('vignetteOverlay');
      if (!el) return;

      // Remove all mood classes
      el.classList.remove('mood-danger', 'mood-warning', 'mood-safe', 'mood-excellent');

      if (mood === 'neutral') {
        el.classList.remove('active');
        vignette.style.boxShadow = 'none';
        return;
      }

      el.classList.add('active', `mood-${mood}`);

      // Subtle vignette matching mood
      const col = getMoodColor(mood);
      vignette.style.boxShadow = `inset 0 0 150px ${col}08, inset 0 0 80px ${col}05`;
    }

    /* ── COMPONENTS ──────────────────────────────── */

    function Onboarding({ onSetTarget }) {
      const [val, setVal] = useState('');
      const [err, setErr] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!val || val.trim() === '') {
          setErr('Budget limit cannot be empty.');
          return;
        }
        const num = Number(val);
        if (isNaN(num) || num <= 0) {
          setErr('Please enter a valid positive number.');
          return;
        }
        onSetTarget(num);
      }

      return h('div', { style: { height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', zIndex: 2 } },
        h('div', { style: { textAlign: 'center', width: '100%', maxWidth: 420, padding: '40px', background: `#080808D9`, border: `1px solid ${S.b1}`, borderRadius: 16, backdropFilter: 'blur(10px)' } },
          h('div', { style: { fontSize: 32, fontWeight: 700, letterSpacing: '-0.03em', marginBottom: 12 } }, '🪶 FinTracker'),
          h('div', { style: { fontSize: 14, color: S.t2, marginBottom: 40 } }, 'What was your monthly budget limit?'),
          h('form', { onSubmit: submit },
            h('div', { style: { position: 'relative', marginBottom: 20 } },
              h('span', { style: { position: 'absolute', left: 20, top: 18, fontSize: 20, color: S.t2 } }, '₹'),
              h('input', {
                autoFocus: true,
                style: { width: '100%', background: '#040404', border: err ? '1px solid #FF5959' : `1px solid ${S.b2}`, borderRadius: 12, padding: '16px 20px 16px 45px', fontSize: 24, color: S.t1, outline: 'none', fontFamily: S.mono, textAlign: 'center' },
                placeholder: 'e.g. 50000',
                value: val,
                type: 'number',
                onChange: e => { setVal(e.target.value); setErr(''); }
              })
            ),
            err ? h('div', { style: { color: '#FF5959', fontSize: 12, marginTop: -10, marginBottom: 20, fontFamily: S.mono } }, err) : null,
            h('button', {
              type: 'submit',
              className: 'btn-primary',
              style: { width: '100%', background: S.t1, color: S.bg, border: 'none', borderRadius: 12, padding: '18px 0', fontSize: 14, fontWeight: 700, cursor: 'pointer', transition: 'opacity 0.2s', letterSpacing: '0.05em' }
            }, 'INITIALIZE DASHBOARD →')
          )
        )
      );
    }

    function Ring({ cat, cx, cy, visible, dimmed, lit, delay, onTap, onOver, onOut, justUnfolded }) {
      const { r, col, spent, budget } = cat;
      const ringC = τ(r);
      const proportion = budget > 0 ? (spent / budget) : 0;
      const fill = ringC * Math.min(proportion, 1);
      const sw = lit ? 25 : 18;
      const opacity = visible ? (dimmed ? 0.1 : 1) : 0;
      const td = justUnfolded ? delay : 0;
      return h('g', {
        style: { cursor: 'pointer' },
        opacity,
        onClick: onTap,
        onMouseEnter: onOver,
        onMouseLeave: onOut,
      },
        h('circle', { cx, cy, r, fill: 'none', stroke: col, strokeWidth: sw, strokeOpacity: 0.07 }),
        h('circle', {
          cx, cy, r, fill: 'none', stroke: col, strokeWidth: sw, strokeLinecap: 'round',
          strokeDasharray: `${fill} ${ringC}`,
          transform: `rotate(-90 ${cx} ${cy})`,
          style: {
            filter: `drop-shadow(0 0 ${lit ? 20 : 6}px ${col}${lit ? 'CC' : '55'})`,
            transition: `opacity 0.45s ${td}ms, filter 0.3s`,
          },
        })
      );
    }

    function GoalRow({ goal, idx }) {
      const [p, setP] = useState(0);
      const pct = Math.min(goal.curr / goal.tgt, 1);
      const R = 26, gC = τ(R);
      useEffect(() => {
        const t = setTimeout(() => setP(pct), 350 + idx * 140);
        return () => clearTimeout(t);
      }, []);
      return h('div', { className: 'goal-row' },
        h('div', { style: { position: 'relative', width: 56, height: 56, flexShrink: 0 } },
          h('svg', { width: 56, height: 56, viewBox: '0 0 56 56' },
            h('circle', { cx: 28, cy: 28, r: R, fill: 'none', stroke: goal.col, strokeWidth: '4', strokeOpacity: '0.15' }),
            h('circle', {
              cx: 28, cy: 28, r: R, fill: 'none', stroke: goal.col, strokeWidth: '4', strokeLinecap: 'round',
              strokeDasharray: `${gC * p} ${gC}`,
              transform: 'rotate(-90 28 28)',
              style: { transition: 'stroke-dasharray 1.1s ease-out', filter: `drop-shadow(0 0 6px ${goal.col}66)` },
            })
          ),
          h('div', { style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 } }, goal.icon)
        ),
        h('div', { className: 'goal-info' },
          h('div', { className: 'goal-header' },
            h('span', { style: { fontSize: 15, fontWeight: 600, color: S.t1, fontFamily: S.display } }, goal.name),
            h('span', { style: { fontSize: 13, color: goal.col, fontFamily: S.mono, fontWeight: 500 } }, `${Math.round(pct * 100)}%`)
          ),
          h('div', { style: { fontSize: 13, color: S.t2, fontFamily: S.mono } },
            fmt(goal.curr),
            h('span', { style: { color: S.t3 } }, ` / ${fmt(goal.tgt)}`)
          )
        )
      );
    }

    /* ── EMOTIONAL BANNER COMPONENT ──────────────*/
    function EmotionalBanner({ totalPct, totalSpent, targetLimit }) {
      if (totalSpent === 0) return null;

      const mood = getMoodState(totalPct);
      const msgs = getMoodMessages(totalPct, totalSpent, targetLimit);
      const displayPct = Math.round(totalPct * 100);

      return h('div', { className: `emotional-banner ${mood}` },
        h('div', { className: 'banner-bg' }),
        h('span', { className: 'banner-icon' }, msgs.icon),
        h('div', { className: 'banner-msg' },
          h('div', { style: { fontWeight: 600, marginBottom: 2 } }, msgs.msg),
          h('div', { style: { fontSize: 11, opacity: 0.7, letterSpacing: '0.04em' } }, msgs.sub)
        ),
        h('span', { className: 'banner-pct' }, `${displayPct}% ${msgs.emoji}`)
      );
    }

    function Plume({ targetLimit }) {
      const [unfolded, setUnfolded] = useState(false);
      const [justUnfolded, setJustUnfolded] = useState(false);
      const [selId, setSelId] = useState(null);
      const [hovId, setHovId] = useState(null);
      const [count, setCount] = useState(0);
      const [mFill, setMFill] = useState(0);

      // Real data state
      const [cats, setCats] = useState([]);
      const [txns, setTxns] = useState([]);
      const [totalSpent, setTotalSpent] = useState(0);
      const [income, setIncome] = useState(0);
      const [isLoading, setIsLoading] = useState(false);
      const [excelUrl, setExcelUrl] = useState(null);

      const cx = 240, cy = 240;
      const totalPct = targetLimit > 0 ? (totalSpent / targetLimit) : 0;
      const outerR = 210, outerC = τ(outerR);
      const outerFill = outerC * Math.min(totalPct, 1) * mFill;
      const activeId = selId || hovId;
      const activeCat = cats.find(c => c.id === activeId);
      const mood = totalSpent > 0 ? getMoodState(totalPct) : 'neutral';
      const moodColor = getMoodColor(mood);
      const displayPct = Math.round(totalPct * 100);
      const displayTxns = activeCat ? txns.filter(t => t.cat === activeCat.name) : txns.slice(0, 10);

      /* Update border glow when mood changes */
      useEffect(() => {
        updateBorderGlow(mood);
      }, [mood]);

      /* Mount animation */
      useEffect(() => {
        const start = Date.now(), dur = 1500;
        const tick = () => {
          const t = Math.min((Date.now() - start) / dur, 1);
          const p = easeOutCubic(t);
          setMFill(p);
          setCount(Math.round(totalSpent * p));
          if (t < 1) requestAnimationFrame(tick);
        };
        if (totalSpent > 0) requestAnimationFrame(tick);
      }, [totalSpent]);

      const toggleFold = useCallback(() => {
        setUnfolded(u => {
          if (!u) { setJustUnfolded(true); setTimeout(() => setJustUnfolded(false), 700); }
          return !u;
        });
        setSelId(null);
      }, []);

      const clickRing = useCallback(id => {
        if (!unfolded) return;
        setSelId(s => s === id ? null : id);
      }, [unfolded]);

      const handleUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsLoading(true);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('budget_limit', targetLimit);

        try {
          const response = await fetch('/api/upload', { method: 'POST', body: formData });
          const data = await response.json();

          if (data.success) {
            const R_START = 186;
            const newCats = Object.entries(data.summary).map(([name, spent], i) => {
              return {
                id: i + 1,
                name: name,
                short: name.substring(0, 4),
                spent: spent,
                budget: targetLimit / Math.max(Object.keys(data.summary).length, 1),
                col: DEFAULT_COLORS[i % DEFAULT_COLORS.length],
                r: Math.max(R_START - (i * 32), 50)
              };
            });
            setCats(newCats);
            setTotalSpent(data.total_expense);
            setIncome(data.total_income);
            setExcelUrl(data.excel_url);

            const newTxns = data.recent.reverse().map((t, i) => {
              const catInfo = newCats.find(c => c.name === t.Category) || { col: '#FFF' };
              return {
                id: i + 1,
                desc: t.Description,
                amt: Math.abs(t.Amount),
                cat: t.Category,
                ago: 'Just now',
                col: catInfo.col
              };
            });
            setTxns(newTxns);
            setCount(0); setMFill(0);
          } else {
            alert('Upload failed: ' + data.error);
          }
        } catch (err) {
          console.error(err);
          alert('Server connection failed.');
        } finally {
          setIsLoading(false);
        }
      };

      /* ── Determine ring colors based on mood ── */
      const outerRingColor = totalSpent > 0 ? moodColor : '#E2DDD6';
      const isAlert = totalPct >= 0.8;

      /* ── RENDER ──────────────────────────────── */
      return h('div', null,

        /* Emotional Banner */
        h(EmotionalBanner, { totalPct, totalSpent, targetLimit }),

        h('div', { className: 'shell' },

          /* ── MAIN GRID ─────────────────────── */
          h('div', { className: 'grid' },

            /* ═══ LEFT: RINGS ═══════════════════ */
            h('div', { className: 'left' },

              /* Logo */
              h('div', { className: 'top-left-logo' },
                h('div', { style: { fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em', fontFamily: S.display, display: 'flex', alignItems: 'center', gap: 14 } },
                  '🪶 FinTracker',
                  h('span', { style: { fontSize: 11, color: S.t2, background: '#0B0B0B', border: `1px solid ${S.b1}`, padding: '3px 9px', borderRadius: 4, letterSpacing: '0.12em', fontFamily: S.mono, fontWeight: 500 } }, 'v2.0')
                )
              ),

              h('div', { className: 'label', style: { marginBottom: 20 } },
                unfolded ? 'tap ring · click center to fold' : 'tap center to bloom'
              ),

              /* SVG Ring Visualization */
              h('div', { style: { position: 'relative', width: '100%', maxWidth: 480 } },
                h('svg', { viewBox: '0 0 480 480', style: { width: '100%', overflow: 'visible' } },

                  /* Outer guide ring */
                  h('circle', { cx, cy, r: outerR, fill: 'none', stroke: outerRingColor, strokeWidth: 1, strokeOpacity: 0.06 }),

                  /* Outer filled ring */
                  h('circle', {
                    cx, cy, r: outerR, fill: 'none',
                    stroke: outerRingColor,
                    strokeWidth: unfolded ? 2 : 22,
                    strokeLinecap: 'round',
                    strokeDasharray: `${outerFill} ${outerC}`,
                    transform: `rotate(-90 ${cx} ${cy})`,
                    style: {
                      transition: 'stroke-width 0.5s cubic-bezier(.4,0,.2,1), filter 0.4s, stroke 0.6s',
                      filter: `drop-shadow(0 0 ${unfolded ? 4 : 16}px ${outerRingColor}${isAlert ? '88' : '33'})`,
                    },
                  }),

                  /* Category rings */
                  ...cats.map((cat, i) => h(Ring, {
                    key: cat.id, cat, cx, cy,
                    visible: unfolded,
                    dimmed: unfolded && activeId !== null && activeId !== cat.id,
                    lit: activeId === cat.id,
                    delay: i * 70,
                    justUnfolded,
                    onTap: () => clickRing(cat.id),
                    onOver: unfolded ? () => setHovId(cat.id) : null,
                    onOut: unfolded ? () => setHovId(null) : null,
                  })),

                  /* Center circle */
                  h('circle', { cx, cy, r: 68, fill: S.card, stroke: S.b1, strokeWidth: 1, style: { cursor: 'pointer' }, onClick: toggleFold }),

                  /* Pulse dot - mood colored */
                  h('circle', { cx, cy: cy - 52, r: 3.5, fill: outerRingColor, className: 'pulse-dot', style: { pointerEvents: 'none' } }),
                ),

                /* Center text overlay - FIXED: smaller text, no overlap */
                h('div', { className: 'ctext' },
                  activeCat
                    ? h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 } },
                      h('div', { style: { fontSize: 10, letterSpacing: '0.14em', color: S.t2, textTransform: 'uppercase', fontFamily: S.display, fontWeight: 600, lineHeight: 1.2 } }, activeCat.short),
                      h('div', { style: { fontSize: 22, letterSpacing: '-0.04em', color: activeCat.col, fontFamily: S.mono, textShadow: `0 0 25px ${activeCat.col}55`, fontWeight: 500, lineHeight: 1.2, whiteSpace: 'nowrap' } },
                        fmt(activeCat.spent)
                      ),
                      h('div', { style: { fontSize: 10, color: S.t2, fontFamily: S.mono, lineHeight: 1.4 } },
                        `${Math.round(activeCat.spent / totalSpent * 100)}% of total`
                      )
                    )
                    : h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 } },
                      h('div', { style: { fontSize: 10, letterSpacing: '0.14em', color: S.t2, textTransform: 'uppercase', fontFamily: S.display, fontWeight: 600, lineHeight: 1.2 } }, 'total spent'),
                      h('div', { style: { fontSize: 22, letterSpacing: '-0.04em', color: totalSpent > 0 ? moodColor : S.t1, fontFamily: S.mono, fontWeight: 500, lineHeight: 1.2, whiteSpace: 'nowrap' } },
                        fmt(count)
                      ),
                      h('div', { style: { fontSize: 10, color: isAlert ? `${moodColor}99` : S.t2, fontFamily: S.mono, lineHeight: 1.4 } },
                        `${displayPct}% spent`
                      )
                    )
                )
              ),

              /* Category legend */
              h('div', {
                style: {
                  opacity: unfolded ? 1 : 0,
                  transition: 'opacity 0.5s 0.4s',
                  display: 'grid', gridTemplateColumns: '1fr 1fr',
                  gap: '8px 20px', marginTop: 30,
                  width: '100%', maxWidth: 440, padding: '0 20px',
                }
              },
                ...cats.map(cat => {
                  const on = activeId === cat.id;
                  return h('div', {
                    key: cat.id,
                    className: `leg${on ? ' active' : ''}`,
                    style: { '--accent': cat.col },
                    onClick: () => clickRing(cat.id),
                    onMouseEnter: unfolded ? () => setHovId(cat.id) : undefined,
                    onMouseLeave: unfolded ? () => setHovId(null) : undefined,
                  },
                    h('div', { className: 'leg-dot', style: { background: cat.col } }),
                    h('div', { style: { flex: 1, minWidth: 0 } },
                      h('div', { className: 'leg-name' }, cat.name),
                      h('div', { className: 'leg-sub' },
                        `${fmt(cat.spent)} · ${Math.round((cat.spent / totalSpent) * 100)}%`,
                        (cat.spent / totalSpent) >= 0.5 && h('span', { style: { color: '#FF5C5C', marginLeft: 4 } }, '!')
                      )
                    )
                  );
                })
              )
            ),

            /* ═══ RIGHT: DATA ════════════════════ */
            h('div', { className: 'right' },

              /* User Profile Header */
              h('div', { className: 'top-right-user', style: { alignItems: 'center' } },
                totalSpent > 0 ? h('span', { className: `mood-badge ${mood}` },
                  getMoodMessages(totalPct, totalSpent, targetLimit).emoji,
                  ' ',
                  mood === 'danger' ? 'OVER BUDGET' : mood === 'warning' ? 'CAUTION' : mood === 'excellent' ? 'EXCELLENT' : 'ON TRACK'
                ) : null,
                h('span', { style: { fontSize: 13, color: S.t2, fontFamily: S.mono, fontWeight: 500, marginLeft: totalSpent > 0 ? 'auto' : 0 } }, 'Piyush · Dashboard')
              ),

              /* Monthly budget section */
              h('div', { className: 'section' },
                h('div', { className: 'label', style: { marginBottom: 15, display: 'flex', alignItems: 'center', gap: 10 } },
                  'monthly budget limit',
                  totalSpent > 0 ? h('span', {
                    style: {
                      width: 8, height: 8, borderRadius: '50%',
                      background: moodColor,
                      display: 'inline-block',
                      boxShadow: `0 0 8px ${moodColor}`,
                      animation: isAlert ? 'pulse 1s ease-in-out infinite' : 'none'
                    }
                  }) : null
                ),
                h('div', { style: { display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 18 } },
                  h('span', { className: 'big-num', style: { color: totalSpent > 0 ? moodColor : S.t1, transition: 'color 0.6s' } }, fmt(totalSpent)),
                  h('span', { style: { fontSize: 16, color: S.t2 } }, `/ ${fmt(targetLimit)}`)
                ),
                h('div', { className: 'bbar' },
                  h('div', {
                    className: 'bfill', style: {
                      width: `${Math.min(totalPct * 100, 100)}%`,
                      background: totalPct >= 1
                        ? 'linear-gradient(90deg,#FFB23F,#FF1744)'
                        : totalPct >= 0.8
                          ? 'linear-gradient(90deg,#FFB23F,#FF5C5C)'
                          : totalPct <= 0.5
                            ? 'linear-gradient(90deg,#00E5FF,#2BD4CA)'
                            : 'linear-gradient(90deg,#3DD998,#2BD4CA)',
                      boxShadow: `0 0 12px ${moodColor}44`,
                      transition: 'width 1.3s cubic-bezier(.4,0,.2,1), background 0.6s, box-shadow 0.6s',
                    }
                  })
                ),
                h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                  h('span', { className: 'label' }, `${Math.round(totalPct * 100)}% used`),
                  h('span', { className: 'label', style: { color: moodColor, transition: 'color 0.6s' } },
                    totalSpent > targetLimit
                      ? `Over by ${fmt(totalSpent - targetLimit)}`
                      : `${fmt(targetLimit - totalSpent)} remaining`
                  )
                )
              ),

              /* Income vs limit */
              h('div', { className: 'section' },
                h('div', { className: 'label', style: { marginBottom: 10 } }, 'income vs limit'),
                h(GoalRow, { key: 'income', goal: { name: 'Total Income', icon: '💼', curr: income, tgt: Math.max(targetLimit, income), col: '#3DD998' }, idx: 0 }),
                h(GoalRow, { key: 'limit', goal: { name: 'Limit Set', icon: '◈', curr: targetLimit, tgt: targetLimit, col: '#FFB23F' }, idx: 1 })
              ),

              /* Recent transactions */
              h('div', { className: 'section-last' },
                h('div', { className: 'label', style: { marginBottom: 15 } }, activeCat ? `all ${activeCat.name} transactions` : 'recent activity'),
                displayTxns.length === 0 ? h('div', { style: { fontSize: 14, color: S.t2, marginTop: 15 } }, 'No transactions found.') : null,
                ...displayTxns.map((t, i) =>
                  h('div', { key: t.id, className: 'txn' },
                    h('div', { className: 'txn-icon', style: { background: `${t.col}0D`, border: `1px solid ${t.col}33` } },
                      h('div', { style: { width: 8, height: 8, borderRadius: '50%', background: t.col } })
                    ),
                    h('div', { style: { flex: 1, minWidth: 0 } },
                      h('div', { style: { fontSize: 15, fontWeight: 500, color: S.t1, marginBottom: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontFamily: S.display } }, t.desc),
                      h('div', { style: { fontSize: 12, color: S.t2, fontFamily: S.display, fontWeight: 500 } }, t.cat)
                    ),
                    h('div', { style: { textAlign: 'right', flexShrink: 0 } },
                      h('div', { style: { fontSize: 15, fontWeight: 500, color: S.t1, fontFamily: S.mono } }, `₹${Math.floor(t.amt).toLocaleString('en-IN')}`),
                      h('div', { style: { fontSize: 11, color: S.t2, fontFamily: S.mono } }, t.ago)
                    )
                  )
                )
              ),

              /* Upload footer */
              h('div', { className: 'footer' },
                h('div', { className: 'label', style: { marginBottom: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                  h('span', null, 'process data'),
                  excelUrl ? h('a', { href: excelUrl, style: { color: '#2BD4CA', textDecoration: 'none', textTransform: 'uppercase', letterSpacing: '0.1em' } }, 'Download Excel ↓') : null
                ),
                h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
                  h('span', { style: { fontSize: 18, flexShrink: 0 } }, '🪶'),
                  h('input', {
                    type: 'file',
                    id: 'csv-upload',
                    accept: '.csv',
                    style: { display: 'none' },
                    onChange: handleUpload
                  }),
                  h('button', {
                    style: { flex: 1 },
                    className: 'qbtn',
                    disabled: isLoading,
                    onClick: () => document.getElementById('csv-upload').click(),
                  }, isLoading ? 'processing...' : 'import transaction csv →')
                )
              )
            ) // right
          ) // grid
        ) // shell
      );
    }

    function App() {
      const [budgetSet, setBudgetSet] = useState(false);
      const [limit, setLimit] = useState(0);

      if (!budgetSet) {
        return h(Onboarding, { onSetTarget: (v) => { setLimit(v); setBudgetSet(true); } });
      }
      return h(Plume, { targetLimit: limit });
    }

    createRoot(document.getElementById('app')).render(h(App));

  </script>
</body>

</html>
